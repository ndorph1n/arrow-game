  <body class="page">
    <div id="app">
      <header class="header">
        <img class="header__logo" src="./src/assets/logo.png" alt="logo" />
        <img class="sound__controls" src="#" alt="sound on/off" />
      </header>

      <div id="pixi-container"></div>

      <footer class="footer controls">
        <p id="bet" class="bet controls__text">
          <span class="label label-bet">Bet</span>
          <span class="dollar-sign">$</span>
          <span class="bet__amount">20</span>
          <span class="bet__control">
            <span>▲</span>
            <span>▼</span>
          </span>
        </p>

        <button id="tap" class="tap">Tap</button>

        <p class="balance controls__text" id="balance">
          <span class="label label-balance">Balance</span>
          <span class="dollar-sign">$</span>
          <span class="balance__amount">1000</span>
        </p>
      </footer>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <img class="loading-logo" src="./src/assets/logo.png" alt="logo" />

        <p id="loading-text" class="loading-text">0%</p>
        <div class="loading-bar">
          <div id="loading-progress" class="loading-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
